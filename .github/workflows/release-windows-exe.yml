name: Release Windows exe

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release and attach Pinterest Downloader CHK.exe
        type: boolean
        default: true
      tag:
        description: Release tag (for example v1.0.0). Ignored on tag pushes.
        type: string
        default: v1.0.0
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    name: Build Pinterest Downloader CHK.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pinterest-dl

      - name: Build Windows exe
        shell: cmd
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "Pinterest Downloader CHK" --collect-all pinterest_dl --collect-all m3u8 pinterest_gui.py

      - name: Verify exe filename
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\Pinterest Downloader CHK.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "dist contents:"
            Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "dist") -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw "Expected dist\Pinterest Downloader CHK.exe (never BUILD, never PINDOWNLOADER)."
          }
          Get-Item -LiteralPath $exe | Select-Object FullName, Length, LastWriteTime

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pinterest Downloader CHK.exe
          path: dist/Pinterest Downloader CHK.exe
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.create_release)
          || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\Pinterest Downloader CHK.exe"
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "${{ inputs.tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v1.0.0"
          }

          $title = "Pinterest Downloader CHK $tag"
          $notes = @"
          Windows executable for Pinterest Downloader CHK. No Python install required.

          Download **Pinterest Downloader CHK.exe** and double-click it.

          If SmartScreen says Windows protected your PC, choose More info, then Run anyway (unsigned build).
          "@

          # Display label keeps spaces. GitHub's Releases API still stores the
          # asset name with periods (Pinterest.Downloader.CHK.exe) — that is
          # platform behavior, not a BUILD/PINDOWNLOADER rename.
          $asset = "$exe#Pinterest Downloader CHK.exe"
          gh release view $tag 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --clobber $asset
          } else {
            gh release create $tag $asset --title $title --notes $notes --target $env:GITHUB_SHA
          }
